name: WardMate build
on:
  push:
    branches: [kha, deploy, 'kha-feat-*']
  pull_request:
    branches: [kha, deploy]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore WardMate.sln
      - run: dotnet build WardMate.sln -c Release --no-restore -warnaserror
