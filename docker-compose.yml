version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: wardmate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wardmate_admin
      POSTGRES_PASSWORD: wardmate_secret
      POSTGRES_DB: wardmate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: wardmate_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: wardmate_secret
    ports:
      - "5050:80"
    depends_on:
      - postgres

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: wardmate_azurite
    restart: unless-stopped
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose

volumes:
  postgres_data:
  azurite_data:
