name: wardmate

services:
  notifications-db:
    profiles: [notifications, analytics]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wardmate_notifications_db
      POSTGRES_USER: wardmate_notifications
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - notifications-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardmate_notifications -d wardmate_notifications_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  analytics-system:
    profiles: [notifications, analytics]
    build:
      context: ..
      dockerfile: src/Services/WardMate.Services.AnalyticsSystem/WardMate.Services.AnalyticsSystem.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__NotificationsDatabase: Host=notifications-db;Port=5432;Database=wardmate_notifications_db;Username=wardmate_notifications;Password=${NOTIFICATIONS_DB_PASSWORD:-}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: wardmate
      Jwt__Audience: wardmate-client
      Iam__BaseUrl: http://iam-api:8080/
      Workflow__BaseUrl: http://application-workflow:8080/
      Analytics__ServiceKey: ${ANALYTICS_SERVICE_KEY:-}
      Analytics__JobsEnabled: ${ANALYTICS_JOBS_ENABLED:-false}
      Analytics__LookbackDays: ${ANALYTICS_LOOKBACK_DAYS:-7}
      Analytics__Cron: ${ANALYTICS_CRON:-15 1 * * *}
      Database__AutoMigrate: "true"
      RabbitMq__Enabled: ${NOTIFICATIONS_ENABLED:-false}
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-wardmate_admin}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-}
      Notifications__WorkersEnabled: ${NOTIFICATIONS_ENABLED:-false}
      Notifications__ServiceKey: ${NOTIFICATIONS_SERVICE_KEY:-}
      Notifications__RevalidateSeconds: "15"
      Email__FrontendBaseUrl: ${NOTIFICATION_FRONTEND_URL:-https://wardmate-frontend.vercel.app/}
      Email__Enabled: ${NOTIFICATION_EMAIL_ENABLED:-false}
      Email__Host: ${NOTIFICATION_EMAIL_HOST:-}
      Email__Port: ${NOTIFICATION_EMAIL_PORT:-587}
      Email__From: ${NOTIFICATION_EMAIL_FROM:-}
      Email__Username: ${NOTIFICATION_EMAIL_USERNAME:-}
      Email__Password: ${NOTIFICATION_EMAIL_PASSWORD:-}
      Sms__Provider: eSMS
      Sms__SmsType: "2"
      Sms__Enabled: ${NOTIFICATION_SMS_ENABLED:-false}
      Sms__ApiKey: ${NOTIFICATION_SMS_API_KEY:-}
      Sms__SecretKey: ${NOTIFICATION_SMS_SECRET_KEY:-}
      Sms__Brandname: ${NOTIFICATION_SMS_BRANDNAME:-}
      Sms__Sandbox: ${NOTIFICATION_SMS_SANDBOX:-1}
      Sms__TemplatesApproved: ${NOTIFICATION_SMS_TEMPLATES_APPROVED:-false}
      Sms__Templates__SUBMITTED: ${NOTIFICATION_SMS_TEMPLATE_SUBMITTED:-}
      Sms__Templates__UNDER_REVIEW: ${NOTIFICATION_SMS_TEMPLATE_UNDER_REVIEW:-}
      Sms__Templates__NEED_REVISION: ${NOTIFICATION_SMS_TEMPLATE_NEED_REVISION:-}
      Sms__Templates__DOCUMENTS_READY: ${NOTIFICATION_SMS_TEMPLATE_DOCUMENTS_READY:-}
      Sms__Templates__OFFICIALLY_RECEIVED: ${NOTIFICATION_SMS_TEMPLATE_OFFICIALLY_RECEIVED:-}
      Sms__Templates__CANCELLED: ${NOTIFICATION_SMS_TEMPLATE_CANCELLED:-}
      Sms__Templates__INLINE_COMMENT_ADDED: ${NOTIFICATION_SMS_TEMPLATE_INLINE_COMMENT_ADDED:-}
      Sms__Templates__OFFICER_ASSIGNED: ${NOTIFICATION_SMS_TEMPLATE_OFFICER_ASSIGNED:-}
      Sms__Templates__OFFICER_UNASSIGNED: ${NOTIFICATION_SMS_TEMPLATE_OFFICER_UNASSIGNED:-}
      Sms__Templates__OFFICER_SUBMITTED: ${NOTIFICATION_SMS_TEMPLATE_OFFICER_SUBMITTED:-}
      Sms__Templates__OFFICER_UNDER_REVIEW: ${NOTIFICATION_SMS_TEMPLATE_OFFICER_UNDER_REVIEW:-}
    ports:
      - "5006:8080"
    depends_on:
      notifications-db:
        condition: service_healthy
      iam-api:
        condition: service_started

  workflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wardmate_workflow_db
      POSTGRES_USER: wardmate_workflow
      POSTGRES_PASSWORD: ${WORKFLOW_DB_PASSWORD:?Set WORKFLOW_DB_PASSWORD in docker/.env}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - workflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardmate_workflow -d wardmate_workflow_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  application-workflow:
    build:
      context: ..
      dockerfile: src/Services/WardMate.Services.ApplicationWorkflow/WardMate.Services.ApplicationWorkflow.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__WorkflowDatabase: Host=workflow-db;Port=5432;Database=wardmate_workflow_db;Username=wardmate_workflow;Password=${WORKFLOW_DB_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Database__AutoMigrate: "true"
      ProcedureCatalog__BaseUrl: http://procedure-catalog:8080/
      Services__DocumentForm__BaseUrl: http://document-form:8080/
      Analytics__ServiceKey: ${ANALYTICS_SERVICE_KEY:-}
      Iam__BaseUrl: http://iam-api:8080/
      RabbitMq__Enabled: ${NOTIFICATIONS_ENABLED:-false}
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-wardmate_admin}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-}
    ports:
      - "5003:8080"
    depends_on:
      workflow-db:
        condition: service_healthy
      iam-api:
        condition: service_started

  # Independent database for Procedure Catalog; no shared initialization scripts.
  procedure-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wardmate_procedure_db
      POSTGRES_USER: wardmate_procedure
      POSTGRES_PASSWORD: ${PROCEDURE_DB_PASSWORD:?Set PROCEDURE_DB_PASSWORD in docker/.env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - procedure-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardmate_procedure -d wardmate_procedure_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Document Form API Microservice (port 5004)
  document-form:
    build:
      context: ..
      dockerfile: src/Services/WardMate.Services.DocumentForm/WardMate.Services.DocumentForm.API/Dockerfile
    image: wardmate-document-form:local
    container_name: wardmate_document_form
    restart: unless-stopped
    environment:
      Iam__BaseUrl: http://iam-api:8080/
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: wardmate
      Jwt__Audience: wardmate-client
      ConnectionStrings__DocumentDb: Host=postgres;Port=5432;Database=wardmate_documentform_db;Username=wardmate_admin;Password=wardmate_secret
      Database__AutoMigrate: "true"
      AzureBlob__ConnectionString: ${AZURE_BLOB_CONNECTION_STRING:-UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://host.docker.internal}
      AzureBlob__ContainerName: form-templates
      Services__ApplicationWorkflow__BaseUrl: http://application-workflow:8080/
      Gotenberg__Url: http://gotenberg:3000
    ports:
      - "5004:8080"
    depends_on:
      postgres:
        condition: service_healthy
      gotenberg:
        condition: service_started

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    # Internal conversion service; no public host port.

  # Procedure Catalog API Microservice (port 5002)
  procedure-catalog:
    build:
      context: ..
      dockerfile: src/Services/WardMate.Services.ProcedureCatalog/WardMate.Services.ProcedureCatalog.API/Dockerfile
    image: wardmate-procedure-catalog:local
    container_name: wardmate_procedure_catalog
    restart: unless-stopped
    environment:
      Iam__BaseUrl: http://iam-api:8080/
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ProcedureDatabase: Host=procedure-db;Port=5432;Database=wardmate_procedure_db;Username=wardmate_procedure;Password=${PROCEDURE_DB_PASSWORD}
      Database__AutoMigrate: "true"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: wardmate
      Jwt__Audience: wardmate-client
      AzureBlob__ConnectionString: ${AZURE_BLOB_CONNECTION_STRING:-}
      ProcedureDrafts__ExtractionEnabled: ${PROCEDURE_EXTRACTION_ENABLED:-false}
      ProcedureDrafts__AiOcrUrl: http://ai-ocr:8080
      DocumentForm__BaseUrl: http://document-form:8080/
      ProcedureDrafts__ServiceKey: ${AIOCR_SERVICE_KEY:-}
    ports:
      - "5002:8080"
    depends_on:
      procedure-db:
        condition: service_healthy

  # IAM database (port 5433)
  iam-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wardmate_iam_db
      POSTGRES_USER: wardmate
      POSTGRES_PASSWORD: ${IAM_DB_PASSWORD:-wardmate_secret}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - iam-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardmate -d wardmate_iam_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # IAM API Microservice (port 5001)
  iam-api:
    build:
      context: ..
      dockerfile: src/Services/WardMate.Services.IAM/WardMate.Services.IAM.API/Dockerfile
    image: wardmate-iam:local
    container_name: wardmate-iam-api-1
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=iam-db;Port=5432;Database=wardmate_iam_db;Username=wardmate;Password=${IAM_DB_PASSWORD:-wardmate_secret}
      Notifications__ServiceKey: ${NOTIFICATIONS_SERVICE_KEY:-}
      Database__AutoMigrate: "true"
      Sms__Enabled: ${Sms__Enabled:-false}
      Sms__Provider: eSMS
      Sms__ApiKey: ${Sms__ApiKey:-}
      Sms__SecretKey: ${Sms__SecretKey:-}
      Sms__Brandname: ${Sms__Brandname:-Baotrixemay}
      Sms__SmsType: ${Sms__SmsType:-2}
      Sms__Sandbox: ${Sms__Sandbox:-1}
      Email__Enabled: ${NOTIFICATION_EMAIL_ENABLED:-false}
      Email__Host: ${NOTIFICATION_EMAIL_HOST:-smtp.gmail.com}
      Email__Port: ${NOTIFICATION_EMAIL_PORT:-587}
      Email__From: ${NOTIFICATION_EMAIL_FROM:-}
      Email__Username: ${NOTIFICATION_EMAIL_USERNAME:-}
      Email__Password: ${NOTIFICATION_EMAIL_PASSWORD:-}
      Email__LoginUrl: ${IAM_EMAIL_LOGIN_URL:-https://wardmate-frontend.vercel.app/login}
      Jwt__Key: ${JWT_KEY}
    ports:
      - "5001:8080"
    depends_on:
      iam-db:
        condition: service_healthy

  # YARP Gateway (port 5000)
  gateway:
    build:
      context: ..
      dockerfile: src/Gateways/WardMate.YarpGateway/Dockerfile
    image: wardmate-gateway:local
    container_name: wardmate-gateway-1
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ReverseProxy__Clusters__iam__Destinations__primary__Address: http://iam-api:8080/
      ReverseProxy__Clusters__procedure-catalog__Destinations__primary__Address: http://procedure-catalog:8080/
      ReverseProxy__Clusters__document-form__Destinations__primary__Address: http://document-form:8080/
      ReverseProxy__Clusters__application-workflow__Destinations__primary__Address: http://application-workflow:8080/
      ReverseProxy__Clusters__analytics-system__Destinations__primary__Address: http://analytics-system:8080/
    ports:
      - "5000:8080"
    depends_on:
      - iam-api
      - procedure-catalog

  # pgAdmin 4 - Quản lý giao diện Web PostgreSQL (port 5050)
  pgadmin:
    image: dpage/pgadmin4
    container_name: wardmate_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@wardmate.com
      PGADMIN_DEFAULT_PASSWORD: Password123!
    ports:
      - "5050:80"
    depends_on:
      iam-db:
        condition: service_healthy

  # 1. PostgreSQL 16 tích hợp pgvector & 35 bảng schema khởi tạo (port 5432)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wardmate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wardmate_db
      POSTGRES_USER: wardmate_admin
      POSTGRES_PASSWORD: wardmate_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d # Tự chạy script SQL khi init
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardmate_admin -d wardmate_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 Caching (port 6379)
  redis:
    image: redis:7-alpine
    container_name: wardmate_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. RabbitMQ Message Broker (kèm Management Dashboard - port 5672, 15672)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: wardmate_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-wardmate_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"   # Cổng kết nối AMQP
      - "15672:15672" # Cổng Dashboard Web (user/pass: wardmate_admin / wardmate_secret)

  ai-ocr:
    profiles: ["ai"]
    build:
      context: ..
      dockerfile: src/Services/WardMate.Services.AIOCR/WardMate.Services.AIOCR.API/Dockerfile
    image: wardmate-aiocr:local
    restart: unless-stopped
    environment:
      Iam__BaseUrl: http://iam-api:8080/
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in docker/.env}
      Jwt__Issuer: wardmate
      Jwt__Audience: wardmate-client
      Assistant__Enabled: ${AIOCR_ASSISTANT_ENABLED:-false}
      ConnectionStrings__AiOcrDatabase: ${AIOCR_DATABASE_CONNECTION_STRING:-}
      Database__AutoMigrate: ${AIOCR_AUTO_MIGRATE:-false}
      Services__ApplicationWorkflow__BaseUrl: http://application-workflow:8080/
      Services__DocumentForm__BaseUrl: http://document-form:8080/
      Extraction__Enabled: ${PROCEDURE_EXTRACTION_ENABLED:-false}
      Extraction__UseAI: ${PROCEDURE_USE_AI:-false}
      Extraction__OcrFallbackEnabled: ${PROCEDURE_OCR_FALLBACK_ENABLED:-false}
      ServiceAuthentication__Key: ${AIOCR_SERVICE_KEY:-}
      DocumentIntelligence__Endpoint: ${DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      DocumentIntelligence__Key: ${DOCUMENT_INTELLIGENCE_KEY:-}
      Extraction__Provider: ${PROCEDURE_AI_PROVIDER:-AzureOpenAI}
      Gemini__Key: ${GEMINI_API_KEY:-}
      Gemini__Model: ${GEMINI_MODEL:-}
      AzureOpenAI__Endpoint: ${AZURE_OPENAI_ENDPOINT:-}
      AzureOpenAI__Key: ${AZURE_OPENAI_KEY:-}
      AzureOpenAI__Deployment: ${AZURE_OPENAI_DEPLOYMENT:-}
    expose:
      - "8080"

volumes:
  rabbitmq-data:
  notifications-data:
  workflow-data:
  procedure-data:
  iam-data:
  postgres_data:
  redis_data:


