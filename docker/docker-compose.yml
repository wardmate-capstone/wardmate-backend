# Local Dev: PostgreSQL, IAM API, YARP Gateway and pgAdmin.
name: wardmate
services:
  iam-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wardmate_iam_db
      POSTGRES_USER: wardmate
      POSTGRES_PASSWORD: ${IAM_DB_PASSWORD:?Set IAM_DB_PASSWORD in docker/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - iam-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardmate -d wardmate_iam_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  iam-api:
    image: wardmate-iam:local
    build:
      context: ..
      dockerfile: src/Services/WardMate.Services.IAM/WardMate.Services.IAM.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: "Host=iam-db;Port=5432;Database=wardmate_iam_db;Username=wardmate;Password=${IAM_DB_PASSWORD:?Set IAM_DB_PASSWORD in docker/.env}"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in docker/.env}
      Database__AutoMigrate: "true"
    ports:
      - "127.0.0.1:5001:8080"
    depends_on:
      iam-db:
        condition: service_healthy

  gateway:
    image: wardmate-gateway:local
    build:
      context: ..
      dockerfile: src/Gateways/WardMate.YarpGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Clusters__iam__Destinations__primary__Address: http://iam-api:8080/
    ports:
      - "127.0.0.1:5000:8080"
    depends_on:
      iam-api:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4
    container_name: wardmate_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@wardmate.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in docker/.env}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      iam-db:
        condition: service_healthy

volumes:
  iam-data:
